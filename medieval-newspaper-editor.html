tion:"南部灰烬山脉观测到的古老黑龙振翅影迹",isClipart:!0,clipartId:"dragon",scale:85},{id:"block_div_1",type:"divider",style:"ornament",ornamentType:"fleur-de-lis"},{id:"block_ad_1",type:"ad",title:"莫林药水工坊：强效隐形药剂",content:"只需两枚银币，遁入阴影，无声无息！适合潜行、避难、潜入高塔。本月购买加赠解毒剂一瓶。",price:"售价：2枚银币",merchant:"圣塞西尔西街4号 莫林工坊",borderStyle:"dashed"}]},{id:"col_1_2",blocks:[{id:"block_art_1",type:"article",title:"黑龙突袭南部秘银矿山 皇家骑士团克日出征",subtitle:"帝国矿工行会死伤惨重，教皇下达神圣诏令号召冒险者同往御敌",author:"大理石城特约记录官 艾尔温",paragraphs:["在古老而寂静的南部灰烬山脉，烈焰之灾再度降临。昨日薄暮时分，一头体型庞大的远古黑龙拍打着如黑夜般深邃的巨翼，突破了南部矿区的魔法防御结界，吐出炽烈的硫磺龙息，导致多座秘银矿坑化为火海。","根据幸存矿工描述，这头恶兽在废墟中搜刮了整整三箱未开采的纯净秘银原石，并将其运往高耸入云的火山巢穴。矿工行会会长拉尔夫老泪纵横地控诉称：'这是近五十年来最惨重的损失，行会的基石被付之一炬！'","圣塞西尔王都今日清晨敲响了十二道金钟。圣骑士团长加拉哈德已奉皇家诏令，亲率精锐狮鹫骑士、皇家法师顾问以及二十名圣光祭司，克日启程前往南部行省，誓要讨伐此獠，夺回秘银。教皇陛下亦降下神圣祝福，号召一切信仰圣光的自由冒险者集结同往。"],dropCap:!0,fontSize:"sm",font:"font-serif",align:"justify"}]}]},{id:"row_2",split:"1-1-1",columns:[{id:"col_2_1",blocks:[{id:"block_hl_1",type:"headline",text:"【皇家法师通缉令】",subtitle:"危险巫师在逃，提供线索赏金翻倍",font:"font-xiaowei",size:"normal"},{id:"block_art_2",type:"article",title:"高塔学徒盗走至高奥术法书",subtitle:"疑似叛逃至黑森林",author:"至高法师议会",paragraphs:["帝国奥术高塔昨日发布紧急悬赏。三级法术学徒里奥涉嫌在夜间巡值时，使用伪造的议会印章，盗走了记载着八阶禁咒《星辰陨落》的古老羊皮纸法书。任何提供其线索或成功将其生擒的冒险者，可前往法师公会领取五百枚金币的巨额赏金。警告：此人极度危险，可能已掌握部分禁忌奥术。"],dropCap:!1,fontSize:"xs",font:"font-kai",align:"left"}]},{id:"col_2_2",blocks:[{id:"block_img_2",type:"image",src:"",filter:"woodblock",caption:"被盗的至高法书《星辰陨落》摹本印记",isClipart:!0,clipartId:"spellbook",scale:60},{id:"block_div_2",type:"divider",style:"dotted"},{id:"block_ad_2",type:"ad",title:"橡木桶酒馆：招募启事",content:"招募洗碗工、后厨帮工与高级吟游诗人各一名。日薪八枚铜币，管两顿黑面包与新鲜麦芽酒。有抗击哥布林或半兽人经验者优先录用！",price:"薪资：每日8枚铜币",merchant:"王都北广场 橡木桶酒馆",borderStyle:"ornate"}]},{id:"col_2_3",blocks:[{id:"block_art_3",type:"article",title:"炼金术士研发出'丰饶之露'",subtitle:"作物熟期缩短十天，产量暴增",author:"绿野行省农业官",paragraphs:["经过长达三年的炼金配方调制，绿野行省的炼金大师们终于宣布，他们利用微量妖精粉尘与腐殖土混合，研制出名为'丰饶之露'的新型农田增产剂。据试验，该药液能使麦田熟期缩短十天，亩产提高近三成。帝国农业部已批准在下月春耕时，于王都周边的皇家麦田进行首批试点推广。"],dropCap:!0,fontSize:"xs",font:"font-serif",align:
