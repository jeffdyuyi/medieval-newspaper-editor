盗走了记载着八阶禁咒《星辰陨落》的古老羊皮纸法书。任何提供其线索或成功将其生擒的冒险者，可前往法师公会领取五百枚金币的巨额赏金。警告：此人极度危险，可能已掌握部分禁忌奥术。"],dropCap:!1,fontSize:"xs",font:"font-kai",align:"left"}]},{id:"col_2_2",blocks:[{id:"block_img_2",type:"image",src:"",filter:"woodblock",caption:"被盗的至高法书《星辰陨落》摹本印记",isClipart:!0,clipartId:"spellbook",scale:60},{id:"block_div_2",type:"divider",style:"dotted"},{id:"block_ad_2",type:"ad",title:"橡木桶酒馆：招募启事",content:"招募洗碗工、后厨帮工与高级吟游诗人各一名。日薪八枚铜币，管两顿黑面包与新鲜麦芽酒。有抗击哥布林或半兽人经验者优先录用！",price:"薪资：每日8枚铜币",merchant:"王都北广场 橡木桶酒馆",borderStyle:"ornate"}]},{id:"col_2_3",blocks:[{id:"block_art_3",type:"article",title:"炼金术士研发出‘丰饶之露’",subtitle:"作物熟期缩短十天，产量暴增",author:"绿野行省农业官",paragraphs:["经过长达三年的炼金配方调制，绿野行省的炼金大师们终于宣布，他们利用微量妖精粉尘与腐殖土混合，研制出名为‘丰饶之露’的新型农田增产剂。据试验，该药液能使麦田熟期缩短十天，亩产提高近三成。帝国农业部已批准在下月春耕时，于王都周边的皇家麦田进行首批试点推广。"],dropCap:!0,fontSize:"xs",font:"font-serif",align:"justify"}]}]}]};function w1(i){if(!i||!Array.isArray(i.rows))return md;const a=new Set,s=new Set,o=new Set,d=i.rows.map((h,f)=>{let p=h.id;(!p||o.has(p))&&(p=`row_${Date.now()}_${f}_${Math.random().toString(36).substring(2,7)}`),o.add(p);const x=(h.columns||[]).map((g,b)=>{let y=g.id;(!y||s.has(y))&&(y=`col_${p}_${b}_${Math.random().toString(36).substring(2,7)}`),s.add(y);const j=(g.blocks||[]).map((C,N)=>{let M=C.id;return(!M||a.has(M))&&(M=`block_${Date.now()}_${N}_${Math.random().toString(36).substring(2,7)}`),a.add(M),{...C,id:M}});return{...g,id:y,blocks:j}});return{...h,id:p,columns:x}});return{...i,rows:d}}const Rb=B.createContext(void 0),gj=({children:i})=>{const[a,s]=B.useState(()=>{const F=localStorage.getItem("medieval_newspaper_data");let ee=w1(md);if(F)try{const ie=JSON.parse(F);ee=w1(ie)}catch{}return{past:[],present:ee,future:[]}}),o=a.present,d=a.past.length>0,h=a.future.length>0,f=Yn.useCallback(F=>{s(ee=>{const ie=typeof F=="function"?F(ee.present):F;return ie===ee.present?ee:{past:[...ee.past,ee.present].slice(-30),present:ie,future:[]}})},[]),p=Yn.useCallback(()=>{s(F=>{if(F.past.length===0)return F;const ee=F.past[F.past.l
